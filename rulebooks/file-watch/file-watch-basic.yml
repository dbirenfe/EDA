---
# ===========================================================================
# File Watch - Basic Example
# ===========================================================================
# Monitors a directory for file changes and triggers actions.
#
# Use cases:
#   - Detect unauthorized config changes
#   - Trigger deployment when a new artifact appears
#   - Audit file modifications
#
# CUSTOMIZE:
#   - Change the path to the directory/file you want to monitor
#   - Adjust conditions for the event types you care about
#   - Change job template names
#
# Note: The file_watch source runs INSIDE the Decision Environment container.
#       The monitored path must be accessible from within that container.
#       For monitoring host files, mount the path or use journald instead.
# ===========================================================================

- name: File Watch - Monitor Directory
  hosts: all
  sources:
    - ansible.eda.file_watch:
        path: /tmp                            # CUSTOMIZE: directory to monitor
        recursive: false

  rules:
    # -----------------------------------------------------------------------
    # Rule 1: New file created
    # -----------------------------------------------------------------------
    - name: React to new files
      condition: event.type == "created" and event.src_path is match("/tmp/eda-.*")
      action:
        debug:
          msg: "New file created: {{ event.src_path }}"
        # For production, replace debug with:
        # run_job_template:
        #   name: "Process New File"
        #   organization: "Default"
        #   job_args:
        #     extra_vars:
        #       file_path: "{{ event.src_path }}"

    # -----------------------------------------------------------------------
    # Rule 2: Config file modified
    # -----------------------------------------------------------------------
    - name: React to config modifications
      condition: event.type == "modified" and event.src_path is match("/tmp/eda-.*\\.conf$")
      action:
        debug:
          msg: "Config file modified: {{ event.src_path }}"
        # For production:
        # run_job_template:
        #   name: "Validate Config"
        #   organization: "Default"
        #   job_args:
        #     extra_vars:
        #       config_file: "{{ event.src_path }}"

    # -----------------------------------------------------------------------
    # Rule 3: File deleted (potential security event)
    # -----------------------------------------------------------------------
    - name: Alert on file deletion
      condition: event.type == "deleted" and event.src_path is match("/tmp/eda-.*")
      action:
        debug:
          msg: "File deleted: {{ event.src_path }}"
