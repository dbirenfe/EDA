---
# ===========================================================================
# Ansible Collection Requirements for the Decision Environment
# ===========================================================================
# Collections listed here will be installed into the DE image.
#
# For offline builds, use local tarball paths:
#   - name: ./collections/ansible-eda-1.5.0.tar.gz
#     type: file
# ===========================================================================

collections:
  # Core EDA collection -- provides webhook, alertmanager source plugins
  - name: ansible.eda

  # Community EDA collection -- provides file_watch, journald (replaces deprecated ansible.eda versions)
  - name: community.eda

  # Add your custom collections below:
  # - name: myorg.myeda
  # - name: community.general
