---
# ===========================================================================
# Environment Configuration for EDA Rulebooks
# ===========================================================================
# This file is loaded directly by ansible-rulebook:
#   CLI:            ansible-rulebook --vars vars/env-config.yml ...
#   EDA Controller: paste contents into activation "Extra Variables" field
#
# Variables must be FLAT (no nesting) for rulebooks to access them.
# In sources/actions: use {{ var_name }}
# In conditions:      use vars.var_name
# ===========================================================================

# ---------------------------------------------------------------------------
# Source plugin settings
# ---------------------------------------------------------------------------
webhook_host: "0.0.0.0"
webhook_port: 5000
alertmanager_host: "0.0.0.0"
alertmanager_port: 8000

# ---------------------------------------------------------------------------
# Job template names (must match templates in AAP Controller)
# ---------------------------------------------------------------------------
remediate_template: "Remediate Service"
notify_template: "Notify Team"
diagnostics_template: "Gather Diagnostics"
aap_organization: "Default"

# ---------------------------------------------------------------------------
# AAP connection (reference for credential setup, not used by rulebooks)
# ---------------------------------------------------------------------------
# aap_gateway_url: "https://aap.example.com"
# aap_controller_url: "https://controller.example.com"

# ---------------------------------------------------------------------------
# Container registry (reference for DE build, not used by rulebooks)
# ---------------------------------------------------------------------------
# registry_host: "quay.example.com"
# registry_namespace: "eda"
# de_image: "custom-de"
# de_tag: "latest"
